<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>İkilem: sınıf içi canlı oylama</title>
  <meta name="description" content="İki seçenekli canlı oylama: öğrenciler karekodu okutup oy verir, sonuçlar anında ekranda.">
  <meta name="theme-color" content="#2f45e0">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/ikilem.css">
</head>
<body class="giris">
  <main>
    <section class="giris-sahne bolunmus" id="sahne" style="--x: 100%" aria-labelledby="marka">
      <div class="katman katman-acik"><h1 class="marka-buyuk" id="marka">İkilem</h1></div>
      <div class="katman katman-koyu" aria-hidden="true"><p class="marka-buyuk">İkilem</p></div>
    </section>

    <section class="giris-alt">
      <p class="ozet">Sınıfta iki seçenekli hızlı oylama. Öğrenciler karekodu okutup telefonlarından oy verir; sonuçlar hem tahtada hem telefonlarda anında görünür.</p>

      <div class="giris-eylem">
        <form class="kod-form" id="kodForm" novalidate>
          <label for="kodGirdi">Öğrenciyseniz ekrandaki kodu girin</label>
          <div class="kod-satir">
            <input class="kod-girdi" id="kodGirdi" name="kod" inputmode="text" autocomplete="off"
                   autocapitalize="characters" spellcheck="false" maxlength="5" size="5" placeholder="K7M2Q"
                   aria-describedby="kodHata">
            <button class="tus tus-ana" type="submit">Katıl</button>
          </div>
          <p class="hata-metni" id="kodHata" role="alert"></p>
        </form>

        <div class="ogretmen-giris">
          <p>Öğretmenseniz</p>
          <a class="tus" href="/ogretmen/">Oylama başlat</a>
          <p class="aciklama">Tahtaya yansıtacağınız ekran açılır; karekod ve canlı sonuçlar orada.</p>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { kodTemizle, kodGecerli, hareketAzalt } from "/assets/js/ortak.js";

    // Açılış: sınır sağdan ortaya kayar (tek, kasıtlı hareket)
    const sahne = document.getElementById("sahne");
    if (hareketAzalt()) sahne.style.setProperty("--x", "50%");
    else requestAnimationFrame(() => requestAnimationFrame(() => {
      sahne.style.transition = "--x 1400ms cubic-bezier(.22,1,.36,1)";
      sahne.style.setProperty("--x", "50%");
    }));

    const girdi = document.getElementById("kodGirdi");
    const hataEl = document.getElementById("kodHata");
    girdi.addEventListener("input", () => {
      const temiz = kodTemizle(girdi.value);
      if (girdi.value !== temiz) girdi.value = temiz;
      hataEl.textContent = "";
    });
    document.getElementById("kodForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const kod = kodTemizle(girdi.value);
      if (!kodGecerli(kod)) {
        hataEl.textContent = "Kod 5 karakterden oluşur. Öğretmen ekranındaki kodu kontrol edin.";
        girdi.focus();
        return;
      }
      location.href = `/k/${kod}`;
    });
  </script>
</body>
</html>
