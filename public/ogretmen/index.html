<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>İkilem: öğretmen ekranı</title>
  <meta name="theme-color" content="#16152f">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/archivo-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/ikilem.css">
</head>
<body class="ogretmen yukleniyor">
  <main class="sahne" id="sahne">
    <section class="arena bolunmus durum-bos" id="arena" aria-label="Canlı sonuçlar">
      <!-- İki katman aynı içeriği taşır; JS şablonu ikisine de kopyalar -->
      <div class="katman katman-acik"></div>
      <div class="katman katman-koyu" aria-hidden="true"></div>
      <p class="arena-rozet" id="rozet" hidden>Oylama bitti</p>
      <p class="gizli-metin" id="ozetMetin"></p>
    </section>

    <aside class="panel" id="panel" aria-label="Oylama denetimleri">
      <div class="katil">
        <a class="qr" id="qr" target="_blank" rel="noopener" aria-label="Öğrenci bağlantısını aç"></a>
        <p class="katil-kod" id="kod" aria-label="Katılım kodu">·····</p>
        <p class="katil-adres" id="adres"></p>
      </div>

      <div class="nabiz">
        <p class="katilimci"><strong id="katilimci">0</strong>kişi katıldı</p>
        <p class="durum-satiri"><span class="nokta" id="nokta"></span><span id="durumMetni">Bağlanıyor</span></p>
      </div>

      <div class="eylemler">
        <button class="tus tus-ana" id="btnYeni" type="button">Yeni oylama <span class="kisayol" aria-hidden="true">N</span></button>
        <button class="tus" id="btnBitir" type="button">Oylamayı bitir <span class="kisayol" aria-hidden="true">B</span></button>
        <button class="tus" id="btnGizle" type="button">Sonuçları gizle <span class="kisayol" aria-hidden="true">G</span></button>
        <div class="eylem-satir">
          <button class="tus tus-sade" id="btnTam" type="button">Tam ekran</button>
          <button class="tus tus-sade" id="btnPanel" type="button">Paneli gizle</button>
        </div>
      </div>

      <details class="gecmis" id="gecmis">
        <summary><span>Önceki oylamalar<span class="gecmis-say" id="gecmisSay"></span></span></summary>
        <ol class="gecmis-liste" id="gecmisListe"></ol>
        <p class="gecmis-bos" id="gecmisBos">Yeni oylama başlattığınızda bitmiş oylamalar burada listelenir.</p>
        <button class="tus tus-sade" id="btnCsv" type="button" hidden>CSV olarak indir</button>
      </details>

      <div class="panel-dip">
        <button class="baglanti-dugme" id="btnOturum" type="button">Yeni kodla baştan başla</button>
      </div>
    </aside>
  </main>

  <div class="mini-qr" id="miniQr" hidden>
    <a class="qr" id="qrMini" target="_blank" rel="noopener" aria-label="Öğrenci bağlantısını aç"></a>
    <p id="kodMini"></p>
    <button class="panel-ac" id="btnPanelAc" type="button">Paneli göster</button>
  </div>

  <dialog class="pencere" id="pencere" aria-labelledby="pencereBaslik">
    <form method="dialog" id="yeniForm">
      <h2 id="pencereBaslik">Yeni oylama</h2>
      <label class="alan">
        <span>Soru</span>
        <textarea class="metin-girdi" id="soruGirdi" maxlength="160" rows="2"
                  placeholder="Örnek: Işık hem dalga hem parçacık gibi davranır mı?"></textarea>
        <small>İsterseniz boş bırakıp soruyu sözlü sorabilirsiniz.</small>
      </label>
      <div class="alan">
        <span>Seçenekler</span>
        <div class="secenek-girdileri">
          <label class="secenek-girdi s1"><span class="no">1</span>
            <input class="metin-girdi" id="secenek1" maxlength="40" placeholder="Evet" aria-label="1. seçenek"></label>
          <label class="secenek-girdi s2"><span class="no">2</span>
            <input class="metin-girdi" id="secenek2" maxlength="40" placeholder="Hayır" aria-label="2. seçenek"></label>
        </div>
      </div>
      <div class="hazirlar" id="hazirlar" aria-label="Hazır seçenekler">
        <button class="hazir" type="button" data-a="Evet" data-b="Hayır">Evet / Hayır</button>
        <button class="hazir" type="button" data-a="Doğru" data-b="Yanlış">Doğru / Yanlış</button>
        <button class="hazir" type="button" data-a="Katılıyorum" data-b="Katılmıyorum">Katılıyorum / Katılmıyorum</button>
        <button class="hazir" type="button" data-a="A" data-b="B">A / B</button>
        <button class="hazir" type="button" data-a="" data-b="">Yalnızca 1 / 2</button>
      </div>
      <label class="onay"><input type="checkbox" id="gizliGirdi"> Sonuçları ben açıklayana kadar gizle</label>
      <div class="pencere-dip">
        <p class="pencere-not" id="pencereNot">Şu anki sonuçlar önceki oylamalara kaydedilir.</p>
        <div class="pencere-dugmeler">
          <button class="tus tus-sade" type="button" id="btnIptal">Vazgeç</button>
          <button class="tus tus-ana" type="submit" id="btnBaslat">Oylamayı başlat</button>
        </div>
      </div>
    </form>
  </dialog>

  <template id="arenaSablon">
    <div class="katman-ic">
      <h1 class="soru" data-alan="soru"></h1>
      <div></div>
      <div class="taraflar">
        <div class="taraf taraf-1">
          <div class="yuzde" data-alan="y1"><span class="yuzde-isaret">%</span><span data-alan="p1">0</span></div>
          <div class="etiket"><span class="no">1</span><span data-alan="e1"></span></div>
          <div class="oy-sayisi" data-alan="s1">0 oy</div>
        </div>
        <div class="taraf taraf-2">
          <div class="yuzde" data-alan="y2"><span class="yuzde-isaret">%</span><span data-alan="p2">0</span></div>
          <div class="etiket"><span class="no">2</span><span data-alan="e2"></span></div>
          <div class="oy-sayisi" data-alan="s2">0 oy</div>
        </div>
      </div>
    </div>
    <span class="esik esik-ust" aria-hidden="true"></span>
    <span class="esik esik-alt" aria-hidden="true"></span>
    <div class="orta orta-bekle"><div class="orta-ic">
      <p class="orta-buyuk">Oylar bekleniyor</p>
      <p class="orta-kucuk">Karekodu okutun ya da kodu girin</p>
    </div></div>
    <div class="orta orta-gizli"><div class="orta-ic">
      <p class="orta-buyuk" data-alan="gizliSayi">0 oy</p>
      <p class="orta-kucuk">Sonuçlar gizli</p>
    </div></div>
  </template>

  <p class="bildirim" id="bildirim" role="status" aria-live="polite"></p>
  <script type="module" src="/assets/js/ogretmen.js"></script>
</body>
</html>
